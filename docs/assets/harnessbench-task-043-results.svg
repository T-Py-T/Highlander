<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">HarnessBench task 043 repeated pilot results</title>
  <desc id="description">A sorted table of mean outcome scores for OpenCode, Hermes, OMP, Codex, and unavailable NanoBot. This is a one-task pilot and does not declare a winner.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091426"/>
      <stop offset="1" stop-color="#132947"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#21d4a7"/>
      <stop offset="1" stop-color="#55a7ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020711" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="30" fill="url(#background)"/>
  <circle cx="1060" cy="76" r="150" fill="#55a7ff" opacity="0.08"/>
  <circle cx="112" cy="702" r="190" fill="#21d4a7" opacity="0.06"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="82" fill="#8ea7c6" font-size="18" font-weight="700" letter-spacing="3">HIGHLANDER · CONTROLLED HARNESS PILOT</text>
    <text x="72" y="132" fill="#f7fbff" font-size="38" font-weight="800">HarnessBench Task 043</text>
    <text x="72" y="168" fill="#b7c9df" font-size="21">GPT-5.4 · medium reasoning · 3 valid trials per available harness</text>

    <g transform="translate(72 206)" filter="url(#shadow)">
      <rect width="1056" height="428" rx="22" fill="#0e1c31" stroke="#294463"/>
      <text x="32" y="48" fill="#8099b8" font-size="15" font-weight="700" letter-spacing="2">RANK</text>
      <text x="116" y="48" fill="#8099b8" font-size="15" font-weight="700" letter-spacing="2">HARNESS</text>
      <text x="386" y="48" fill="#8099b8" font-size="15" font-weight="700" letter-spacing="2">MEAN OUTCOME</text>
      <text x="946" y="48" fill="#8099b8" font-size="15" font-weight="700" letter-spacing="2">POP. σ</text>
      <line x1="28" y1="68" x2="1028" y2="68" stroke="#294463"/>

      <g transform="translate(0 78)">
        <rect x="20" width="1016" height="62" rx="14" fill="#142943"/>
        <text x="42" y="40" fill="#21d4a7" font-size="23" font-weight="800">1</text>
        <text x="116" y="40" fill="#f7fbff" font-size="22" font-weight="750">OpenCode</text>
        <rect x="386" y="20" width="448" height="22" rx="11" fill="#243b58"/>
        <rect x="386" y="20" width="445" height="22" rx="11" fill="url(#bar)"/>
        <text x="852" y="40" fill="#f7fbff" font-size="20" font-weight="800">0.9923</text>
        <text x="946" y="40" fill="#b7c9df" font-size="18">0.0038</text>
      </g>

      <g transform="translate(0 146)">
        <rect x="20" width="1016" height="62" rx="14" fill="#11253d"/>
        <text x="42" y="40" fill="#55a7ff" font-size="23" font-weight="800">2</text>
        <text x="116" y="40" fill="#f7fbff" font-size="22" font-weight="750">Hermes Agent</text>
        <rect x="386" y="20" width="448" height="22" rx="11" fill="#243b58"/>
        <rect x="386" y="20" width="444" height="22" rx="11" fill="url(#bar)"/>
        <text x="852" y="40" fill="#f7fbff" font-size="20" font-weight="800">0.9900</text>
        <text x="946" y="40" fill="#b7c9df" font-size="18">0.0071</text>
      </g>

      <g transform="translate(0 214)">
        <rect x="20" width="1016" height="62" rx="14" fill="#11253d"/>
        <text x="42" y="40" fill="#8ea7c6" font-size="23" font-weight="800">3</text>
        <text x="116" y="40" fill="#f7fbff" font-size="22" font-weight="750">OMP</text>
        <rect x="386" y="20" width="448" height="22" rx="11" fill="#243b58"/>
        <rect x="386" y="20" width="420" height="22" rx="11" fill="url(#bar)"/>
        <text x="852" y="40" fill="#f7fbff" font-size="20" font-weight="800">0.9377</text>
        <text x="946" y="40" fill="#b7c9df" font-size="18">0.0405</text>
      </g>

      <g transform="translate(0 282)">
        <rect x="20" width="1016" height="62" rx="14" fill="#11253d"/>
        <text x="42" y="40" fill="#8ea7c6" font-size="23" font-weight="800">4</text>
        <text x="116" y="40" fill="#f7fbff" font-size="22" font-weight="750">Codex CLI</text>
        <rect x="386" y="20" width="448" height="22" rx="11" fill="#243b58"/>
        <rect x="386" y="20" width="325" height="22" rx="11" fill="url(#bar)"/>
        <text x="852" y="40" fill="#f7fbff" font-size="20" font-weight="800">0.7247</text>
        <text x="946" y="40" fill="#b7c9df" font-size="18">0.3228</text>
      </g>

      <g transform="translate(0 350)">
        <rect x="20" width="1016" height="62" rx="14" fill="#0c192b" stroke="#294463" stroke-dasharray="6 6"/>
        <text x="42" y="40" fill="#607894" font-size="23" font-weight="800">—</text>
        <text x="116" y="40" fill="#9db1ca" font-size="22" font-weight="750">NanoBot</text>
        <text x="386" y="40" fill="#8099b8" font-size="18">Unavailable · no qualified OAuth seed</text>
      </g>
    </g>

    <rect x="72" y="664" width="1056" height="54" rx="16" fill="#172c45" stroke="#294463"/>
    <text x="96" y="698" fill="#dbe9f7" font-size="18" font-weight="650">Claim boundary:</text>
    <text x="240" y="698" fill="#a9bdd5" font-size="18">one task estimates repeatability; it does not declare a winner or justify a stack switch.</text>
  </g>
</svg>
