  <desc id="description">A sorted table of five complete harnesses and one incomplete harness across nine HarnessBench tasks and three attempts per task. Codex ranks first, followed by OpenCode, OMP, Hermes, and NanoBot. Atomic is unranked with 26 of 27 valid slots.</desc>
