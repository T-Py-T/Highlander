services:
  api:
    image: ghcr.io/example/composeapp-api:1.4.2
    ports:
      - "${API_PORT:-8080}:8000"
    environment:
      DATABASE_URL: "postgresql://composeapp:composeapp-dev@db:5432/composeapp"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      QUEUE_NAME: "critical"
      APP_DATA_DIR: "/data"
    volumes:
      - api-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
  worker:
    image: ghcr.io/example/composeapp-worker:1.4.2
    environment:
      DATABASE_URL: "postgresql://composeapp:composeapp-dev@db:5432/composeapp"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      QUEUE_NAME: "critical"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres:16.2-alpine
    environment:
      POSTGRES_DB: composeapp
      POSTGRES_USER: composeapp
      POSTGRES_PASSWORD: composeapp-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U composeapp -d composeapp"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  api-data:
