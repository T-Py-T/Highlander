name: Highlander checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Run Highlander unit tests
        run: python -m unittest discover -s tests

      - name: Validate MatchRunner source and example
        run: |
          python -m compileall -q highlander tools
          python tools/highlander.py doctor examples/matches/fake-t001.json

      - name: Run fixture tests
        run: python -m unittest discover -s fixtures/job-runner -p 'test_*.py'

      - name: Validate runner syntax
        run: bash -n tools/prepare-run.sh
