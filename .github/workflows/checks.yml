name: Highlander checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: ${{ env.ACT != 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Confirm local act Python
        if: ${{ env.ACT == 'true' }}
        run: |
          python --version
          python -c 'import sys; assert sys.version_info >= (3, 11)'

      - name: Run Highlander unit tests
        run: python -m unittest discover -s tests

      - name: Validate MatchRunner source and example
        run: |
          python -m compileall -q highlander tools
          python tools/highlander.py doctor examples/matches/fake-t001.json

      - name: Run fixture tests
        run: python -m unittest discover -s fixtures/job-runner -p 'test_*.py'

      - name: Validate runner syntax
        run: bash -n tools/prepare-run.sh tools/run-act-local.sh containers/base/highlander-entrypoint

      - name: Verify retained evidence
        run: |
          python tools/evidence-bundle.py verify results/fake-t002-protocol-r1
          python tools/hb-evidence.py verify results/hb-devhard-043-gpt54-medium-host4-r1
          python tools/hb-evidence.py verify-season results/hb-devhard-hardcore-v1-gpt-5.6-luna-medium-r4
          python tools/hb-evidence.py verify-season results/hb-devhard-hardcore-v1-gpt-5.4-medium-r1
